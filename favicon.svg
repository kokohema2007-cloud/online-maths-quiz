<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#151d30" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.4" />

  <!-- Inner subtle grid lines for calculus coordinate system -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#334155" stroke-width="3" stroke-dasharray="6,6" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="#334155" stroke-width="3" stroke-dasharray="6,6" />

  <!-- Hyperbolic curve in background -->
  <path d="M 120 130 Q 256 300 392 130" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" filter="url(#glow)" />

  <!-- Integral symbol ∫ and dy/dx text -->
  <text x="180" y="360" font-family="'Cairo', system-ui, sans-serif" font-size="190" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" filter="url(#glow)">∫</text>
  <text x="320" y="270" font-family="'Fira Code', monospace" font-size="64" font-weight="800" fill="#38bdf8" text-anchor="middle">dy/dx</text>
  <text x="320" y="340" font-family="'Cairo', system-ui, sans-serif" font-size="42" font-weight="900" fill="url(#fireGrad)" text-anchor="middle">GEN002</text>

  <!-- Sparkle fire dots -->
  <circle cx="390" cy="180" r="10" fill="#f97316" filter="url(#glow)" />
  <circle cx="120" cy="330" r="8" fill="#38bdf8" filter="url(#glow)" />
</svg>
